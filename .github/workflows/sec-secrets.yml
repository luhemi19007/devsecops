# Revisa cada commit y Pull Request en busca de secretos que se hayan
# colado por accidente (API keys, contraseñas, tokens, claves privadas...).
# Si encuentra alguno, el workflow falla y bloquea el merge.

name: Secretos — escaneo (Gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # revisa todo el historial, no solo el último commit

      - name: Ejecutar Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
