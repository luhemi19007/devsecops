# Arma una carpeta de publicación limpia (solo lo que el sitio necesita:
# src/index.html + src/js + style.css) y la despliega a GitHub Pages con
# las Actions oficiales de GitHub — sin necesidad de un token personal ni
# de la rama gh-pages a mano.
#
# Requisito único en el repositorio: Settings → Pages → Source → deja
# "GitHub Actions" seleccionado (no "Deploy from a branch").

name: Deploy — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Preparar sitio
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Armar carpeta de publicación (dist/)
        run: |
          mkdir -p dist/js
          cp src/index.html dist/index.html
          cp src/js/app.js dist/js/app.js
          cp src/js/ai-assistant.js dist/js/ai-assistant.js
          cp style.css dist/style.css
          # dentro de dist/, index.html y style.css quedan en el mismo nivel
          sed -i 's#href="\.\./style\.css"#href="style.css"#' dist/index.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
